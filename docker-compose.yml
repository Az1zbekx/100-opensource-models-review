version: '3.9'
services:
  mms_tts_uzb:
    build:
      context: ./tts/mms-tts-uzb
      dockerfile: Dockerfile
    ports:
    - 8001:8000
    volumes:
    - ./tts/mms-tts-uzb:/app
    - ./models/mms-tts-uzb:/app/models
    environment:
      MODEL_NAME: mms-tts-uzb
      PORT: '8000'
    restart: 'no'
    container_name: model-mms-tts-uzb
    stdin_open: true
    tty: true
    networks:
    - models-network
  fasterwhisper:
    build:
      context: ./stt/FasterWhisper
      dockerfile: Dockerfile
    ports:
    - 8002:8000
    volumes:
    - ./stt/FasterWhisper:/app
    - ./models/FasterWhisper:/app/models
    environment:
      MODEL_NAME: FasterWhisper
      PORT: '8000'
    restart: 'no'
    container_name: model-FasterWhisper
    stdin_open: true
    tty: true
    networks:
    - models-network
  qwen2_5_1_5b_instruct_gguf:
    build:
      context: ./llm/Qwen2.5-1.5B-Instruct-GGUF
      dockerfile: Dockerfile
    ports:
    - 8003:8000
    volumes:
    - ./llm/Qwen2.5-1.5B-Instruct-GGUF:/app
    - ./models/Qwen2.5-1.5B-Instruct-GGUF:/app/models
    environment:
      MODEL_NAME: Qwen2.5-1.5B-Instruct-GGUF
      PORT: '8000'
    restart: 'no'
    container_name: model-Qwen2.5-1.5B-Instruct-GGUF
    stdin_open: true
    tty: true
    networks:
    - models-network
volumes: {}
networks:
  models-network:
    driver: bridge
